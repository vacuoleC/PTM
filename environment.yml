name: ptm-encoder

channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.11.15
  - numpy=2.4.6
  - pandas=3.0.3
  - scikit-learn=1.9.0
  - scipy=1.17.1
  - pyyaml=6.0.3
  - matplotlib=3.11.0
  - seaborn=0.13.2
  # H100 上训练标签冻结的定量 PTM encoder。
  - pytorch=2.6.*
  - pytorch-cuda=12.4
  - pip
  - pip:
      # CPTAC 数据访问与当前使用的 XGBoost Python 发行版。
      - cptac==1.5.14
      - xgboost==3.2.0
