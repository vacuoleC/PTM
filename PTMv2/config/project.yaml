project:
  name: PTMv2
  canonical_root: "D:\\coding\\PTM"
  task_root: "D:\\coding\\PTM\\PTMv2"
  archive_policy: "PTMv1 is read-only and Git-ignored"

paths:
  v1_archive_root: "../PTMv1"
  source_matrix: "../PTMv1/outputs/lscc_multi_ptm_resid.pkl.gz"
  source_labels: "../PTMv1/outputs/lscc_grade_g2_vs_g3_labels.csv"
  study_design: "study_design.yaml"
  data_manifest: "data/manifest.tsv"
  processed_data: "data/processed"
  scripts: "scr"
  tests: "tests"
  outputs: "outputs"
  figures: "outputs/figures"
  tables: "outputs/tables"
  reports: "outputs/reports"

runtime:
  python_executable: "D:\\enviranment\\ptm-encoder\\python.exe"
  remote_python_command: "python"
  random_seed: 0

monitoring:
  heartbeat_interval_minutes: 30
  long_task_progress_interval: 10
  remote_ssh_alias: "sensecore"
  remote_project_root: "/data/PTM"
  remote_log_directory: "/data/PTM/logs"
  e2_2_smoke_job_name: "e2_2_fixed_parameter_oof_smoke"
  e2_2_smoke_pid_file: "/data/PTM/logs/e2_2_fixed_parameter_oof_smoke.pid"
  e2_2_smoke_log_file: "/data/PTM/logs/e2_2_fixed_parameter_oof_smoke.log"
  e2_2_smoke_output_file: "/data/PTM/PTMv2/outputs/tables/e2_2_fixed_parameter_oof_smoke.csv"

e2_2_smoke:
  detection_threshold: 0.1
  classifier_C: 0.1
  classifier_l1_ratio: 0.5
  outer_assignments: "outputs/tables/e2_2_outer_split_assignments.csv"
  output: "outputs/tables/e2_2_fixed_parameter_oof_smoke.csv"
  fold_summary: "outputs/tables/e2_2_fixed_parameter_oof_smoke_fold_summary.csv"
  repeat_summary: "outputs/tables/e2_2_fixed_parameter_oof_smoke_repeat_summary.csv"

audit_outputs:
  cohort_summary: "outputs/tables/e1_1_cohort_label_audit.csv"
  class_counts: "outputs/tables/e1_1_class_counts.csv"
  cohort_figure: "outputs/figures/e1_1_cohort_label_distribution.svg"
  cohort_report: "outputs/reports/e1_1_cohort_label_audit.md"
  measurement_summary: "outputs/tables/e1_2_measurement_summary.csv"
  threshold_counts: "outputs/tables/e1_2_detection_threshold_counts.csv"
  measurement_figure: "outputs/figures/e1_2_detection_thresholds.svg"
  measurement_report: "outputs/reports/e1_2_measurement_audit.md"
